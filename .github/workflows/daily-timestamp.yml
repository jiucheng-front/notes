name: Daily timestamp commit

on:
  schedule:
    - cron: '0 8 * * *' # 每天 08:00 UTC 执行，按需调整
  workflow_dispatch: {}

jobs:
  update-timestamp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Update timestamp file
        run: |
          # 使用仓库的默认分支（此仓库的默认分支是 master）
          git checkout ${{ github.event.repository.default_branch }} || true
          echo "Last commit: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .daily_commit
          git add .daily_commit
          git commit -m "chore: update daily timestamp $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "no changes to commit"
          git push origin HEAD
